name: Quest development verification
on:
  workflow_dispatch:
  push:
    paths: ['quest-lite/**', '.github/workflows/quest-lite.yml']
  pull_request:
    paths: ['quest-lite/**', '.github/workflows/quest-lite.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix quest-lite
      - run: npm --prefix quest-lite test
      - run: npx playwright install --with-deps chromium
        working-directory: quest-lite
      - run: npm --prefix quest-lite run test:browser
      - run: npm --prefix quest-lite run test:widgets
      - run: gradle --no-daemon -p quest-lite :app:assembleDebug :app:lintDebug :spatial:assembleDebug :spatial:testDebugUnitTest :spatial:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: luma-lite-debug
          path: quest-lite/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: luma-spatial-development-not-device-verified
          path: quest-lite/spatial/build/outputs/apk/debug/spatial-debug.apk
