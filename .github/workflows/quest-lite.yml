name: Quest Lite APK
on:
  workflow_dispatch:
  push:
    paths: ['quest-lite/**', '.github/workflows/quest-lite.yml']
  pull_request:
    paths: ['quest-lite/**', '.github/workflows/quest-lite.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon -p quest-lite assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: metamanning-lite-debug
          path: quest-lite/app/build/outputs/apk/debug/app-debug.apk
